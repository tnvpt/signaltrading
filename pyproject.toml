[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signaltrading"
version = "0.1.0"
description = "Public market-data recorder and event scanner; no order execution"
requires-python = ">=3.11"
dependencies = ["websockets>=14,<16"]

[project.scripts]
signaltrading = "signaltrading.cli:main"

[tool.setuptools.packages.find]
include = ["signaltrading*"]